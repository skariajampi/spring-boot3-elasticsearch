spring:
  application:
    name: spring-boot3-elasticsearch
  elasticsearch:
    uris: https://localhost:9200
    username: elastic
    password: password123
  data:
    elasticsearch:
      repositories:
        enabled: true
  profiles:
    active: dev



management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: spring-boot3-elasticsearch
      environment: local

  tracing:
    enabled: true
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

#otel:
#  exporter:
#    otlp:
#      endpoint: http://localhost:4318/v1/logs

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.example.skaria.elasticsearch: INFO

